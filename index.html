:root{--ink:#25262a;--ink2:#4b4d55;--led-off:#4a1313}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0c0f;overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#desk{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#272a31 0%,#101115 62%,#07080a 100%)}
#stage{position:absolute;left:0;top:0;width:1000px;height:500px;transform-origin:0 0;will-change:transform}
#chassis{position:absolute;inset:0;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#d9dbe0 0%,#cdd0d6 40%,#c3c6cd 100%);
  box-shadow:0 0 0 1px #62656d,0 0 0 4px #aeb1b9,0 0 0 5px #6b6e76,0 34px 46px rgba(0,0,0,.65),0 8px 14px rgba(0,0,0,.5)}
#chassis::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.95;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .22  0 0 0 .42 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#chassis::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;z-index:50;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 5px rgba(0,0,0,.3),inset 3px 0 4px rgba(255,255,255,.3),inset -3px 0 4px rgba(0,0,0,.16),inset 0 0 0 5px rgba(255,255,255,.10),inset 0 0 0 6px rgba(0,0,0,.10),inset 0 0 46px rgba(0,0,0,.12)}
.band{position:absolute;left:0;right:0}
.groove{position:absolute;left:0;right:0;height:3px;background:#3b3c42;box-shadow:0 1px 0 rgba(255,255,255,.65),0 -1px 0 rgba(0,0,0,.3)}
.vline{position:absolute;width:2px;background:#3b3c42;box-shadow:1px 0 0 rgba(255,255,255,.6)}

.lab{position:absolute;white-space:nowrap;font:700 9.5px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.07em;
  color:var(--ink);text-transform:uppercase;pointer-events:none;transform:translate(-50%,-50%)}
.lab.sm{font-size:9px;letter-spacing:.06em}
.lab.lg{font-size:11px}
.brk{position:absolute;border:1.5px solid var(--ink);border-bottom:none;height:5px;pointer-events:none}
/* LEDs */
.led{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#8c3a3a,var(--led-off) 70%);
  box-shadow:inset 0 0 2px rgba(0,0,0,.7),0 0 0 1.6px #5b5d65,0 1.4px 0 1.6px rgba(255,255,255,.55);transition:background .05s}
.led.on{background:radial-gradient(circle at 42% 34%,#fff0ea 0%,#ff5a45 38%,#d3200f 100%);
  box-shadow:0 0 5px 2px rgba(255,64,44,.8),0 0 15px 5px rgba(255,64,44,.38),0 0 0 1.6px #5b5d65}
.led.cur{animation:cur .5s steps(1) infinite}
@keyframes cur{50%{background:radial-gradient(circle at 42% 34%,#ffe7b8 0%,#ffa42a 40%,#c25a00 100%);box-shadow:0 0 5px 2px rgba(255,160,40,.8),0 0 0 1.6px #5b5d65}}
.led.dim{opacity:.35}
.led.sq{border-radius:2px;width:14px;height:6px;margin:-3px 0 0 -7px}
/* knobs — light-grey knurled caps with a dark pointer, after the Roland TB-03 */
.knob{position:absolute;touch-action:none;cursor:ns-resize}
.knob::before{content:"";position:absolute;inset:-12px;border-radius:50%}
.kticks{position:absolute;pointer-events:none;overflow:visible}
.kshadow{position:absolute;inset:-2%;border-radius:50%;transform:translate(6%,10%);pointer-events:none;
  background:radial-gradient(circle,rgba(0,0,0,.5) 55%,rgba(0,0,0,0) 76%);filter:blur(2.4px)}
.kbase{position:absolute;inset:-5%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#7c7f88 0,#7c7f88 86%,#a9acb3 90%,#5c5f68 96%,rgba(0,0,0,0) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.5)}
.kbody{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from -40deg,#f6f7f8 0deg,#c8cbd1 70deg,#9a9da6 150deg,#8b8e97 205deg,#bdc0c7 275deg,#f6f7f8 360deg);
  box-shadow:0 2px 3px rgba(0,0,0,.6),0 0 0 1px #6a6d76,inset 0 0 0 1px rgba(255,255,255,.65)}
.krot{position:absolute;inset:0;border-radius:50%;transition:transform .07s ease-out}
.knob.st .krot{transition:transform .17s cubic-bezier(.3,1.55,.5,1)}
.kridge{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.6) 0 1.6deg,rgba(40,42,50,.55) 1.6deg 3.2deg);
  -webkit-mask:radial-gradient(circle,transparent 0,transparent 66%,#000 69%);mask:radial-gradient(circle,transparent 0,transparent 66%,#000 69%)}
.kcap{position:absolute;inset:17%;border-radius:50%;
  background:radial-gradient(circle at 36% 28%,#fbfbfc 0%,#e1e3e7 42%,#bfc2c9 100%);
  box-shadow:inset 1.2px 1.4px 1px rgba(255,255,255,.95),inset -1.4px -1.8px 2px rgba(60,62,72,.55),0 1.5px 3px rgba(0,0,0,.55),0 0 0 .8px #8a8d96}
.kind{position:absolute;left:50%;top:5%;width:5.2%;height:38%;transform:translateX(-50%);border-radius:2px;
  background:linear-gradient(90deg,#34353b,#1d1e22);box-shadow:0 0 0 .5px rgba(255,255,255,.4)}
.kgloss{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse 50% 30% at 36% 19%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
.knob.active .kshadow{transform:translate(4%,7%)}
/* buttons */
.slot{position:absolute;border-radius:6px;background:#a0a3ab;box-shadow:inset 0 2px 4px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.7);pointer-events:none}
.btn{position:absolute;border-radius:4px;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.05em;color:var(--ink);
  background:linear-gradient(180deg,#eeeff1 0%,#d3d5d9 50%,#bcbfc5 100%);

/* keys */

/* jacks & switches */
.jack{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;

/* ================= theme (colour variables for the single grey finish) ================= */
#chassis{--b1:#d9dbe0;--b2:#cdd0d6;--b3:#c3c6cd;--ink:#25262a;--ink2:#4b4d55;--groove:#3b3c42;--hi:rgba(255,255,255,.65);--edge:#aeb1b9;
 --bt1:#eeeff1;--bt2:#d3d5d9;--bt3:#bcbfc5;--bsh:#80838b;--bink:#25262a;
 --dk1:#575a6b;--dk2:#3a3d4d;--dk3:#2a2c39;--dksh:#0e0f16;--dkink:#f3f3ef;
 --gy1:#8d909a;--gy2:#6f727d;--gy3:#5a5d68;--gysh:#2c2e36;
 --wk1:#f2f2ef;--wk2:#dcdcd6;--wk3:#c6c6bf;--wksh:#85878f;--wkink:#2a2b30;
 --bk1:#4d5164;--bk2:#33364a;--bk3:#23253a;--bksh:#0c0d15;--bkink:#e9e9e5;
 --slot:#a0a3ab;--led1:#fff0ea;--led2:#ff5a45;--led3:#d3200f;--glow:255,64,44;--ledoff:#4a1313;--kind:#f4f3ee;--red:#6a1c14;
 background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 40%,var(--b3) 100%);
 box-shadow:0 0 0 1px #62656d,0 0 0 4px var(--edge),0 0 0 5px #6b6e76,0 34px 46px rgba(0,0,0,.65),0 8px 14px rgba(0,0,0,.5)}
.groove,.vline{background:var(--groove)}
.groove{box-shadow:0 1px 0 var(--hi),0 -1px 0 rgba(0,0,0,.3)}
.vline{box-shadow:1px 0 0 var(--hi)}
.kticks line{stroke:var(--ink)}
svg polyline{stroke:var(--ink)}
.helpbtn{color:var(--ink2)}
.slot{background:var(--slot)}
.led{background:radial-gradient(circle at 38% 30%,#8c3a3a,var(--ledoff) 70%)}
.led.on{background:radial-gradient(circle at 42% 34%,var(--led1) 0%,var(--led2) 38%,var(--led3) 100%);
 box-shadow:0 0 5px 2px rgba(var(--glow),.8),0 0 15px 5px rgba(var(--glow),.38),0 0 0 1.6px #5b5d65}
.btn{color:var(--bink);background:linear-gradient(180deg,var(--bt1) 0%,var(--bt2) 50%,var(--bt3) 100%);
 box-shadow:0 3px 0 var(--bsh),0 5px 7px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 2px rgba(0,0,0,.2)}
.btn.down{box-shadow:0 .5px 0 var(--bsh),0 2px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.dark{color:var(--dkink);background:linear-gradient(180deg,var(--dk1) 0%,var(--dk2) 45%,var(--dk3) 100%);
 box-shadow:0 3px 0 var(--dksh),0 5px 7px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 2px rgba(0,0,0,.5)}
.btn.dark.down{box-shadow:0 .5px 0 var(--dksh),0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.grey{color:#fafafa;background:linear-gradient(180deg,var(--gy1) 0%,var(--gy2) 50%,var(--gy3) 100%);
 box-shadow:0 3px 0 var(--gysh),0 5px 7px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 2px rgba(0,0,0,.35)}
.btn.grey.down{box-shadow:0 .5px 0 var(--gysh),0 2px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.wkey{color:var(--wkink);background:linear-gradient(180deg,var(--wk1) 0%,var(--wk2) 55%,var(--wk3) 100%);
 box-shadow:0 4px 0 var(--wksh),0 6px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 2px rgba(0,0,0,.15)}
.wkey.down{box-shadow:0 1px 0 var(--wksh),0 3px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9)}

 box-shadow:0 4px 0 var(--bksh),0 6px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 2px rgba(0,0,0,.5)}
.bkey.down{box-shadow:0 1px 0 var(--bksh),0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
/* chassis detail: light falloff, etched lines, screws */
.sheen{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 70% at 18% 8%,rgba(255,255,255,.34),rgba(255,255,255,0) 70%),
             radial-gradient(ellipse 70% 80% at 92% 100%,rgba(30,32,40,.16),rgba(30,32,40,0) 70%)}

/* lite mode: cheaper rendering for older phones */
html.lite #chassis::after,html.lite .sheen{display:none}
html.lite #chassis{box-shadow:0 0 0 1px #62656d,0 0 0 4px var(--edge),0 0 0 5px #6b6e76,0 10px 16px rgba(0,0,0,.5)}

html.lite .knob.st .krot{transition:none}

  const root = 36 + pick([0, 2, 3, 5, 7, 9, 10]);
  const p = blankPat();
  let prevNote = false;
  for (let i = 0; i < 16; i++) {
    const st = p.steps[i];
    const r = R();
    if (i > 0 && r < 0.2) { st.k = 0; prevNote = false; continue; }
    if (i > 0 && prevNote && r < 0.3) { st.k = 2; continue; }
    st.k = 1; prevNote = true;
    let m = root + (R() < 0.45 ? 0 : pick(scale));
    const o = R();
    if (o < 0.18) m += 12; else if (o < 0.26) m -= 12;
    setFromMidi(st, clamp(m, 24, 60));
    st.a = R() < 0.27 ? 1 : 0;
    st.s = R() < 0.18 ? 1 : 0;
  }
  p.steps[0].k = 1; if (p.steps[0].k === 1 && !p.steps.some(x => x.k === 1)) p.steps[0].k = 1;
  p.steps[15].s = 0;
  return {
    g: 'USER', name: 'RANDOM', bpm: Math.round(rr(116, 146)), pat: p,
    k: [.5, rr(.14, .55), rr(.35, .92), rr(.3, .9), rr(.15, .7), rr(.4, .9)].map(v => +v.toFixed(3)),
    w: R() < .3 ? 1 : 0, d: R() < .35 ? 1 : 0, dl: R() < .45 ? 1 : 0, rv: R() < .3 ? 1 : 0

function stepStrip(str) {

  });

}
